name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # `serve` is needed: the API tests import FastAPI. `neural` is
        # deliberately left out — it pulls in torch, and every test that needs a
        # model is either stubbed or marked `network` and excluded below, so the
        # suite stays a fast, deterministic check of the logic.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[serve,dev]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -m "not network" --durations=10
